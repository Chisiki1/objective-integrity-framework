name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Static public package checks
        run: python -B tools/check.py
      - name: Runtime and clean-consumer regressions
        run: python -B tools/check.py --runtime --temp-root "${{ runner.temp }}"

  desktop:
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes --no-deps -r harness/requirements-windows.txt
      - name: Supported harness regressions
        run: python -B harness/scripts/check.py
      - name: Compile dedicated Windows app
        shell: powershell
        run: ./harness/scripts/Build-Desktop.ps1
