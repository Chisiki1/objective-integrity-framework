name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Privacy scan
        run: python tools/privacy_scan.py .
      - name: Git history scan
        run: python tools/history_scan.py .
      - name: No-drop check
        run: python tools/no_drop_check.py .
      - name: Schema validation
        run: python tools/validate_schemas.py
      - name: Link check
        run: python tools/link_check.py .
      - name: Evaluation fixtures
        run: python tools/eval_runner.py .
      - name: Unit tests
        run: python -m unittest discover -s tests
