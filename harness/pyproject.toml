[project]
name = "hermes-policy-harness"
version = "0.3.0b2"
description = "OIF desktop harness with persistent objectives, reusable learning and controlled self-improvement"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph>=1.0,<2", "langgraph-checkpoint-sqlite>=3,<4",
  "deepagents>=0.7,<1", "langchain-openai>=1,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3",
  "pypdf>=6,<7",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
[project.scripts]
policy-harness = "policy_harness.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/policy_harness"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
  "tests/test_practical_runtime.py", "tests/test_practical_context.py",
  "tests/test_practical_growth.py", "tests/test_usability_learning.py", "tests/test_optional_learning.py",
  "tests/test_desktop_maintenance.py", "tests/test_artifact_preview.py",
  "tests/test_conversation_records.py", "tests/test_progress_consumers.py",
  "tests/test_ui_preferences.py", "tests/test_whole_ui_repairs.py",
  "tests/test_providers.py", "tests/test_provider_credential_history.py",
  "tests/test_credential_recovery_continuity.py", "tests/test_provider_evidence_recovery.py",
  "tests/test_server.py", "tests/test_executor.py", "tests/test_updates.py",
  "tests/test_source_input_ui.py", "tests/test_chat_recovery.py",
  "tests/test_full_access.py", "tests/test_full_access_ui.py", "tests/test_public_package.py", "tests/test_product_updates.py"
]

# Fixed acceptance for the shipped PracticalEngine and its complete shared
# storage, permissions, provider, UI, execution, recovery and update paths.
# Historical Engine fixtures remain in tests and in every baseline snapshot.
# Only trusted root maintenance can enroll this file; candidates cannot edit it.
[tool.oif.verification]
paths = [
  "tests/test_practical_runtime.py", "tests/test_practical_context.py",
  "tests/test_practical_growth.py", "tests/test_usability_learning.py", "tests/test_optional_learning.py",
  "tests/test_desktop_maintenance.py", "tests/test_artifact_preview.py",
  "tests/test_conversation_records.py", "tests/test_progress_consumers.py",
  "tests/test_ui_preferences.py", "tests/test_whole_ui_repairs.py",
  "tests/test_providers.py", "tests/test_provider_credential_history.py",
  "tests/test_credential_recovery_continuity.py", "tests/test_provider_evidence_recovery.py",
  "tests/test_server.py", "tests/test_executor.py", "tests/test_updates.py",
  "tests/test_source_input_ui.py", "tests/test_chat_recovery.py",
  "tests/test_full_access.py", "tests/test_full_access_ui.py", "tests/test_public_package.py", "tests/test_product_updates.py"
]
